# Nom du workflow
name: Pipeline SenSante Pro

# EVENTS : Les evenements qui declenchent ce pipeline
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read
  checks: write

# JOBS : Les taches a executer
jobs:
  test-backend:
    name: Tests du backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: demo_pro
          POSTGRES_USER: demo_user
          POSTGRES_PASSWORD: demo_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
        - name: Checkout du code
          uses: actions/checkout@v4

        - name: Installation de Java 21
          uses: actions/setup-java@v4
          with:
            java-version: '21'
            distribution: 'temurin'
            cache: 'maven'

        - name: Exécution des tests
          env:
            ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          run: |
            echo "Tests Spring Boot SenSante Pro"
            mvn test --no-transfer-progress
            echo "Tests réussis"

        - name: Rapport de tests
          if: always()
          uses: dorny/test-reporter@v1
          with:
            name: Rapports de tests
            path: target/surefire-reports/*.xml
            reporter: java-junit

  build-backend:
    name: Construction du backend
    runs-on: ubuntu-latest
    needs: test-backend

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: demo_pro
          POSTGRES_USER: demo_user
          POSTGRES_PASSWORD: demo_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
        # Clonage du depot sur le runner
        - name: Checkout du code
          uses: actions/checkout@v4

        # Installation de Java
        - name: Installation de Java 21
          uses: actions/setup-java@v4
          with:
            java-version: '21'
            distribution: 'temurin'
            cache: 'maven'

        # Compilation et packaging (tests deja valides par test-backend)
        - name: Build Spring Boot
          run: |
            echo "Complilation Spring Boot SenSante Pro"
            mvn clean package -DskipTests --no-transfer-progress
            echo "Build réussi"

        # Sauvegarder le JAR
        - name: Sauvegarde du jar comme artefact
          uses: actions/upload-artifact@v4
          with:
            name: sensante-pro-jar
            path: target/*.jar

  build-frontend:
    name: Construction du frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Installation des dépendances
        run: npm ci

      - name: Build React + Vite
        run: npm run build

      - name: Sauvegarde du dossier dist
        uses: actions/upload-artifact@v4
        with:
          name: sensante-pro-frontend
          path: frontend/dist/

  verify-pipeline:
    name: Verification du pipeline
    runs-on: ubuntu-latest
    needs: [build-backend, test-backend, build-frontend]

    # STEPS : Etapes du job, executees dans l'ordre
    steps:
        - name: Afficher les infos du commit
          run: |
            echo 'Pipeline SenSante Pro - Sprint 0'
            echo "Branche : ${{ github.ref_name }}"
            echo "Auteur : ${{ github.actor }}"
            echo "Evénement : ${{ github.event_name }}"