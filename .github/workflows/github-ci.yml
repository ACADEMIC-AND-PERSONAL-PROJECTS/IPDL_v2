# Nom du workflow
name: Pipeline SenSante Pro

# EVENTS : Les evenements qui declenchent ce pipeline
on:
    push:
        branches: [develop, main]
    pull_request:
        branches: [develop, main]

# JOBS : Les taches a executer
jobs:
    build-backend:
        name: Construction du backend
        runs-on: ubuntu-latest
        steps:
            # Clonage du depot sur le runner
            - name: Checkout du code
              uses: actions/checkout@v4
            
            # Installation de Java
            - name: Installation de Java 21
              uses: actions/setup-java@v4
              with:
                java-version: '21'
                distribution: 'temurin'
                cache: 'maven'

            # Compilation avec maven
            - name: Build Spring Boot
              run: |
                echo "Complilation Spring Boot SenSante Pro"
                mvn clean package -DskipTests --no-transfer-progress
                echo "Build réussi target/sensante-pro-*.jar"

            # Sauvegarder le JAR
            - name: Sauvegarde du jar comme artefact
              uses: actions/upload-artifact@v4
              with:
                name: sensante-pro-jar
                path: target/*.jar

    verify-pipeline:
        name: Verification du pipeline
        runs-on: ubuntu-latest
        needs: build-backend

        # STEPS : Etapes du job, executees dans l'ordre
        steps:
            - name: Afficher les infos du commit
              run: |
                echo 'Pipeline SenSante Pro - Sprint 0'
                echo "Branche : ${{ github.ref_name }}"
                echo "Auteur : ${{ github.actor }}"
                echo "Evénement : ${{ github.event_name }}"        