# docker-compose.yml --- Environnement de développement pour le projet
services:
  postgres:
    image: postgres:15-alpine
    container_name: demo_app
    environment:
      POSTGRES_DB: demo_pro
      POSTGRES_USER: demo_user
      POSTGRES_PASSWORD: demo_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo_user -d demo_pro"]
      interval: 10s
      timeout: 30s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: demo_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@demo.sn
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data: