# =======================================#
#   SenSante Pro — Configuration PROD    #
#   Profil actif : prod                  #
# =======================================#

# ── Base de données PostgreSQL (depuis les variables d'environnement) ──
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── HikariCP — Connection pool production ──
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# ── JPA / Hibernate ──
# update : cree les tables manquantes sans ecraser les donnees existantes.
# Passer a validate une fois le schema stabilise (ou utiliser Flyway).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# spring.jpa.database-platform : laisse Hibernate le detecter automatiquement
spring.jpa.properties.hibernate.generate_statistics=false

# ── JWT (depuis les variables d'environnement) ──
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ── Spring AI / DeepSeek (token depuis la variable d'environnement) ──
spring.ai.openai.api-key=${ANTHROPIC_AUTH_TOKEN}
spring.ai.openai.base-url=https://api.deepseek.com
spring.ai.openai.chat.model=deepseek-v4-flash
spring.ai.openai.chat.max-tokens=500
spring.ai.openai.chat.temperature=0.3

# ── Logging — Niveau reduit en production ──
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.com.example.demo=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.level.org.springframework.boot.web.embedded.tomcat=INFO
logging.level.org.apache.catalina=WARN
logging.level.com.zaxxer.hikari=WARN

# ── Swagger / SpringDoc — Desactive en production ──
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false