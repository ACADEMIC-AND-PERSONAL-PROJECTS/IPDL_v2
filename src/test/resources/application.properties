# ======================================#
#   Test Configuration                   #
# ======================================#

# Base H2 en memoire pour les tests (CI utilise PostgreSQL via service container)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA - Hibernate pour H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# JWT (meme secret que la config principale pour les tests)
jwt.secret=sensante-pro-secret-key-esp-ucad-dakar-2025-minimum-256-bits
jwt.expiration=86400000

# AI - Valeur factice pour les tests (le vrai token est injecte via CI)
spring.ai.openai.api-key=test-dummy-token-for-ci

# Autorise @MockitoBean a remplacer les beans existants
spring.main.allow-bean-definition-overriding=true
